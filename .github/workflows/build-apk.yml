name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- security rules
  rules-test:
    name: Firestore & Storage security-rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/rules
        run: npm install --no-audit --no-fund

      - name: Run rules tests on the Firebase emulators
        working-directory: tests/rules
        run: npx firebase emulators:exec --config ../../firebase.json --only firestore,storage --project demo-smart-attendance "npm test"

  # ---------------------------------------------------------------- Android build
  build:
    name: Analyze, test and build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper (official checksum)
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Verify pinned face model (SHA-256)
        run: |
          sha256sum -c assets/models/mobilefacenet.sha256
          test "$(stat -c%s assets/models/mobilefacenet.tflite)" = "5233552"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub secret KEYSTORE_BASE64 is missing. Google Sign-In requires the registered release key. See docs/GITHUB_UPLOAD_AND_BUILD.md, Step 4."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          keytool -list -v -keystore android/app/release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" > cert.txt
          grep -E "SHA1|SHA256" cert.txt
          grep -q "31:E3:3E:99:F4:5A:F0:3C:F1:25:BE:20:D4:68:9A:C5:D3:66:0F:AC" cert.txt \
            || (echo "::error::Keystore SHA-1 does not match the SHA-1 registered in Firebase" && exit 1)
          rm cert.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (errors and warnings fail the build)
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la $APK
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs $APK | tee signer.txt
          grep -qi "31e33e99f45af03cf125be20d4689ac5d3660fac" signer.txt \
            || (echo "::error::APK is not signed with the Firebase-registered key" && exit 1)
          mkdir -p dist
          cp $APK dist/SmartAttendance-v1.0.${{ github.run_number }}.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-APK
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Smart Attendance build ${{ github.run_number }}
          body: |
            Release-signed APK (key SHA-1 31:E3:3E:…:0F:AC, verified in CI).
            Face model SHA-256 be4bc7cfc53f7bc336d0f28b1ab92535f618c913a422b683210750f6b5354854 (verified).
            Not yet device-tested; see docs/STATUS.md.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
