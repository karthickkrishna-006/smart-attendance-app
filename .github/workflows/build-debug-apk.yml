
name: Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tests/rules/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/build-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase rules test dependencies
        working-directory: tests/rules
        run: npm install --no-audit --no-fund

      - name: Run Firebase emulator security tests
        working-directory: tests/rules
        run: npx firebase emulators:exec --config ../../firebase.json --only firestore,storage --project demo-smart-attendance "npm test"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAttendance-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
